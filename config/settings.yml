## YAML NOTE: Indentation, spacing and text case are super important.
# This file must be encoded as Unicode (UTF-8) for it to work properly.

# To change your logo and other interface elements, go to themes/<theme>/options.yml

site_root: /

### YOUR SITE NAME
### Appears in the header and HTML title of the page

site_name: Subfolio-Astro

### YOUR DOMAIN
### Appears in the breadcrumb navigation

site_domain: subfolio-astro

### YOUR COPYRIGHT
### You must turn it on in your theme options to display

site_copyright: "&copy; 2026 Subfolio-Astro by Ryan Ilano"

### OPTIONAL FOOTER CREDIT
### Trusted HTML shown after the copyright, on the same line

site_footer_credit: '<span class="footer__sep">&#8226;</span> An Astro port of <a href="https://github.com/area17/subfolio">Subfolio</a> by <a href="https://area17.com">AREA17</a> [<a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a>] — <a href="https://github.com/ryanilano/subfolio-astro">source</a>.'

### YOUR WEBSITE META DESCRIPTION
### For search engines

site_meta_description: "Subfolio-Astro is a static site generator for portfolios based on folders and markdown."

### YOUR GOOGLE ANALYTICS CODE
### Remove "#" to activate

# google_analytics_code: "UA-XXXXXX-X"

### YOUR ACTIVE THEME / CONTENT LOCATION
### Selects which themes/<theme>/options.yml the build reads

theme: default
directory: directory

### YOUR MARK-UP LANGUAGE (Textile, Markdown or HTML)
### NOTE: not read here — text rendering is driven by SUBFOLIO_TEXT_RENDERING

text_rendering: HTML

### YOUR THUMBNAIL FILE SIZE CAP (in MB)
### Thumbnails will not be generated for image files larger than cap

thumbnail_max_filesize: 10

### IMAGE METADATA
### Published images have their location removed (EXIF GPS, XMP, IPTC).
### Your content files are never changed, only the copies in the build.
### strip_location: false publishes images exactly as they are.
### strip_all_metadata: true removes all metadata except colour profile and orientation.
### Use only true or false: any other value stops the build.

strip_location: true
strip_all_metadata: false
